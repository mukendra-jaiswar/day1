<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Asset/img/css/style.css">
    <title>Classic Pancakes</title>
</head>

<body>

    <div class="img1">
        <img src="Asset/img/bread.png" alt="bread image">
    </div>

   <h3>TODAY'S RECIPE</h3>
    <h1>Classic <br> Pancakes</h1>
    <p>Soft, fluffy and easy to make <br> at home</p>
    <button>View Recipe</button>

    <div class="container">

        <div class="box">
            <img src="Asset/img/time.png" alt="time">
            <div class="part">
                <h2>20 Minutes</h2>
                <p>Total Time</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="box">
            <img src="Asset/img/spoon.png" alt="spoon">
            <div class="part">
                <h2>Easy</h2>
                <p>Difficulty</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="box">
            <img src="Asset/img/people.png" alt="people">
            <div class="part">
                <h2>4 Servings</h2>
                <p>Serves</p>
            </div>
        </div>

    </div>

</body>
</html>
